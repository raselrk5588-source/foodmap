name: Deploy to VPS

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            mkdir -p /var/www/rasel
            cd /var/www/rasel
            
            # If the folder doesn't exist, clone it
            if [ ! -d "foodmap" ]; then
              git clone https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git foodmap
            fi
            
            cd foodmap
            git config --global --add safe.directory /var/www/rasel/foodmap
            
            # Update remote with current action token to prevent auth errors
            git remote set-url origin https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
            
            git fetch origin
            git checkout ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}
            git clean -fd
            
            # Setup Nginx if not already configured
            NGINX_CONF="/etc/nginx/sites-available/foodmap.smritilife.com"
            if [ ! -f "$NGINX_CONF" ]; then
              echo "Creating Nginx configuration..."
              cat << 'EOF' > $NGINX_CONF
            server {
                listen 80;
                server_name foodmap.smritilife.com;
                root /var/www/rasel/foodmap;
                index foodmap.html index.html index.htm;

                location / {
                    try_files $uri $uri/ /foodmap.html =404;
                }
            }
            EOF
              ln -sf $NGINX_CONF /etc/nginx/sites-enabled/
              nginx -t && systemctl restart nginx
              echo "Nginx configured and restarted."
            fi
            
            # Setup SSL using Certbot if not already configured
            if ! grep -q "listen 443" $NGINX_CONF; then
              echo "Setting up SSL..."
              if ! command -v certbot &> /dev/null; then
                apt-get update
                apt-get install -y certbot python3-certbot-nginx
              fi
              certbot --nginx --non-interactive --agree-tos -m admin@smritilife.com -d foodmap.smritilife.com
              echo "SSL configuration completed."
            else
              echo "SSL already configured."
            fi
